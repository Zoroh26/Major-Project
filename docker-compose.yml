services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/src/app:/code/app
      - ./backend/.env:/code/.env
      - ./backend/src/migrations:/code/migrations
      - ./backend/src/alembic.ini:/code/alembic.ini
      - ./backend/src/scripts:/code/scripts

  db:
    image: postgres:13
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    env_file:
      - ./backend/.env
    depends_on:
      - db

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: always
    ports:
      - "8554:8554"        # RTSP TCP
      - "8554:8554/udp"    # RTSP UDP
      - "8000:8000/udp"    # RTP (video data)
      - "8001:8001/udp"    # RTCP (video control)
      - "8888:8888"        # HLS
      - "8889:8889"        # WebRTC
      - "8189:8189/udp"    # ICE
      - "9997:9997"        # REST API
    volumes:
      - ./backend/mediamtx.yml:/mediamtx.yml
    environment:
      - MEDIAMTX_API_ADDRESS=:9997
      - MEDIAMTX_API_UDP=no

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - web

volumes:
  postgres-data:
  pgadmin-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/16
